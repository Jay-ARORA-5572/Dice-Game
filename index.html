<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicee</title>
    <meta name="description" content="A two-player dice-rolling game with best-of-N tournaments, sound effects, and a local leaderboard.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4ECCA3">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Dicee 🎲">
    <meta property="og:description" content="A two-player dice-rolling game with best-of-N tournaments, sound effects, and a local leaderboard.">
    <meta property="og:image" content="assets/og-image.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dicee 🎲">
    <meta name="twitter:description" content="A two-player dice-rolling game with best-of-N tournaments, sound effects, and a local leaderboard.">
    <meta name="twitter:image" content="assets/og-image.png">

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster" rel="stylesheet">
  </head>
  <body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark or light theme">🌙</button>
    <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

    <div class="container">
      <h1 id="heading">Roll the Dice!</h1>

      <div class="player-names">
        <input id="player1-name" class="name-input" type="text" maxlength="16" placeholder="Player 1" aria-label="Player 1 name">
        <input id="player2-name" class="name-input" type="text" maxlength="16" placeholder="Player 2" aria-label="Player 2 name">
      </div>

      <div class="settings">
        <label>
          Dice per player
          <select id="dice-count">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>

        <label>
          First to
          <select id="best-of">
            <option value="1">1 win</option>
            <option value="3" selected>3 wins</option>
            <option value="5">5 wins</option>
          </select>
        </label>

        <label>
          Variant
          <select id="variant">
            <option value="standard">Standard (sum)</option>
            <option value="drop-lowest">Drop lowest die</option>
            <option value="double-sixes-bonus">Double sixes bonus (+2)</option>
          </select>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="vs-computer">
          vs Computer
        </label>
      </div>

      <div class="players">
        <div class="dice player1">
          <p id="player1-label">Player 1</p>
          <div class="dice-row" id="dice-row-1"></div>
          <span class="streak" id="streak-1"></span>
        </div>

        <div class="dice player2">
          <p id="player2-label">Player 2</p>
          <div class="dice-row" id="dice-row-2"></div>
          <span class="streak" id="streak-2"></span>
        </div>
      </div>

      <div class="scoreboard">
        <span id="match-score">Player 1: 0 &nbsp;|&nbsp; Player 2: 0</span>
      </div>

      <div class="controls">
        <button id="roll-btn" class="btn">Roll Dice <span class="hint">(or press space)</span></button>
        <button id="reset-btn" class="btn secondary">Reset Match</button>
      </div>

      <div class="leaderboard">
        <h2>Leaderboard</h2>
        <p class="hint">Tap a result to see the round-by-round breakdown</p>
        <ol id="leaderboard-list"></ol>
        <button id="clear-leaderboard" class="btn text-btn">Clear leaderboard</button>
      </div>

      <div class="online-panel">
        <button id="play-online-btn" class="btn secondary">🌐 Play Online (beta)</button>

        <div id="online-controls" hidden>
          <div id="online-setup">
            <input id="online-name-input" class="name-input" type="text" maxlength="16" placeholder="Your name">
            <div class="online-actions">
              <button id="create-room-btn" class="btn">Create Room</button>
              <span class="hint">or</span>
              <input id="join-code-input" class="name-input code-input" type="text" maxlength="5" placeholder="Room code">
              <button id="join-room-btn" class="btn">Join Room</button>
            </div>
          </div>

          <p id="online-status" class="hint"></p>

          <div id="online-room-info" hidden>
            <p>Room code: <strong id="room-code-display"></strong> — share this with your opponent</p>
            <p id="online-turn-indicator"></p>
            <div class="dice-row" id="online-dice-row"></div>
            <button id="online-roll-btn" class="btn">Roll</button>
            <p id="online-score-display"></p>
            <p id="online-winner-display"></p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="index.js"></script>
    <script type="module" src="js/multiplayer-ui.js"></script>
  </body>
</html>
